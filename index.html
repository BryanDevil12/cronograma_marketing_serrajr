<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Marketing 2026 - Serra Jr.</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Bibliotecas para Gerar PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

  <!-- React e ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel (traduz JSX no navegador) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;

    // --- Ícones SVG ---
    const IconCalendar = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>;
    const IconUser = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>;
    const IconChevronLeft = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>;
    const IconChevronRight = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>;
    const IconX = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>;
    const IconDownload = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>;
    const IconBarChart = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="20" x2="12" y2="10"></line><line x1="18" y1="20" x2="18" y2="4"></line><line x1="6" y1="20" x2="6" y2="16"></line></svg>;
    const IconEye = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>;
    const IconEyeOff = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>;
    const IconHeart = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>;

    // --- BASE DE DADOS INICIAL ---
    const generateId = () => Math.random().toString(36).substr(2, 9);

    const rawInitialDB = {
      "08-06": [{ type: "linkedin", title: "Dia Nacional dos Profissionais da Educação" }],
      "08-11": [{ type: "story", title: "Dia do Estudante" }],
      "08-12": [{ type: "story", title: "Dia Internacional da Juventude" }],
      "08-15": [{ type: "feed", title: "Dia da Informática" }],
      "08-21": [{ type: "feed", title: "Semana da Pessoa com Deficiência Intelectual e Múltipla (21 a 27/08)" }],
      "08-22": [{ type: "story", title: "Dia do Folclore" }],
      "08-31": [{ type: "linkedin", title: "Dia Internacional de Pessoas Afrodescendentes" }]
    };

    const initialEventDB = {};
    Object.keys(rawInitialDB).forEach(key => {
      initialEventDB[key] = rawInitialDB[key].map(ev => ({
        id: generateId(),
        type: ev.type,
        title: ev.title,
        responsible: ev.responsible || '',
        details: ev.details || '',
        views: '',
        engagement: ''
      }));
    });

    const getBadgeStyle = (type) => {
      switch (type) {
        case 'birthday': return 'bg-pink-100 text-pink-700 border-pink-200';
        case 'feed': return 'bg-blue-100 text-blue-700 border-blue-200';
        case 'story': return 'bg-purple-100 text-purple-700 border-purple-200';
        case 'linkedin': return 'bg-indigo-100 text-indigo-700 border-indigo-200';
        case 'video': return 'bg-red-100 text-red-700 border-red-200';
        case 'youtube': return 'bg-red-600 text-white border-red-700';
        case 'tiktok': return 'bg-slate-800 text-white border-slate-900';
        case 'x': return 'bg-slate-900 text-white border-black';
        case 'observacao': return 'bg-amber-100 text-amber-800 border-amber-200';
        default: return 'bg-gray-100 text-gray-700 border-gray-200';
      }
    };

    const getEventIcon = (type) => {
      switch (type) {
        case 'birthday': return '🎂';
        case 'feed': return '📱';
        case 'story': return '🤳';
        case 'linkedin': return '💼';
        case 'video': return '▶️';
        case 'youtube': return '🟥';
        case 'tiktok': return '🎵';
        case 'x': return '𝕏';
        case 'observacao': return '📌';
        default: return '📝';
      }
    };

    const getCurrentMonthIndex = () => {
      const now = new Date();
      return now.getFullYear() === 2026 ? now.getMonth() : 0;
    };

    const MONTHS = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
    const DAYS_OF_WEEK = ["Domingo", "Segunda-feira", "Terça-feira", "Quarta-feira", "Quinta-feira", "Sexta-feira", "Sábado"];

    const EVENT_DB_KEY = 'serraJrMarketingDB2026_v7';
    const TEAM_KEY = 'serraJrTeam2026';

    const loadEventDB = () => {
      const saved = localStorage.getItem(EVENT_DB_KEY);
      return saved ? JSON.parse(saved) : initialEventDB;
    };

    const buildCalendarData = (eventDB) => {
      const year = 2026;
      const data = [];
      for (let month = 0; month < 12; month++) {
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const monthData = [];
        for (let day = 1; day <= daysInMonth; day++) {
          const dateObj = new Date(year, month, day);
          const dayOfWeek = DAYS_OF_WEEK[dateObj.getDay()];
          const monthKey = String(month + 1).padStart(2, '0');
          const dayKey = String(day).padStart(2, '0');
          const key = `${monthKey}-${dayKey}`;
          const events = eventDB[key] || [];
          monthData.push({ dateKey: key, dateStr: `${dayKey}/${monthKey}`, dayOfWeek, events, hasEvents: events.length > 0 });
        }
        data.push(monthData);
      }
      return data;
    };

    const exportMonthToPDF = (currentMonthData, monthName, totalPosts) => {
      if (!window.jspdf) {
        alert("Aguarde um momento, o gerador de PDF ainda está carregando...");
        return;
      }
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF('landscape');

      doc.setFontSize(16);
      doc.text(`Relatório de Marketing - ${monthName} 2026`, 14, 15);
      doc.setFontSize(10);
      doc.setTextColor(100);
      doc.text(`Serra Jr. Engenharia | Total de Publicações Planejadas: ${totalPosts}`, 14, 21);

      const tableData = [];
      currentMonthData.forEach(day => {
        if (day.hasEvents) {
          day.events.forEach(ev => {
            let metricText = '';
            if (ev.views || ev.engagement) {
              metricText = `Views: ${ev.views || 0} | Interações: ${ev.engagement || 0}`;
            }
            tableData.push([
              day.dateStr,
              ev.type.toUpperCase(),
              ev.title,
              ev.responsible || '-',
              ev.details || '-',
              metricText || '-'
            ]);
          });
        }
      });

      if (tableData.length === 0) { alert("Nenhum evento neste mês para exportar."); return; }

      doc.autoTable({
        startY: 28,
        head: [['Data', 'Plataforma', 'Título', 'Responsável', 'Detalhes', 'Resultados']],
        body: tableData,
        styles: { fontSize: 9, cellPadding: 3 },
        headStyles: { fillColor: [15, 23, 42] },
      });

      doc.save(`marketing-serrajr-${monthName.toLowerCase()}-2026.pdf`);
    };

    function App() {
      const [currentMonthIndex, setCurrentMonthIndex] = useState(getCurrentMonthIndex);
      const [eventDB] = useState(loadEventDB);
      const [selectedDay, setSelectedDay] = useState(null);
      const [hideEmptyDays, setHideEmptyDays] = useState(false);

      const calendarData = useMemo(() => buildCalendarData(eventDB), [eventDB]);
      const currentMonthData = calendarData[currentMonthIndex];

      const displayedDays = hideEmptyDays
        ? currentMonthData.filter(day => day.hasEvents)
        : currentMonthData;

      const dashboardStats = useMemo(() => {
        let totalPosts = 0;
        let totalViews = 0;
        let totalEngagement = 0;

        currentMonthData.forEach(day => {
          day.events.forEach(ev => {
            if (ev.type !== 'birthday' && ev.type !== 'observacao') {
              totalPosts++;
              totalViews += Number(ev.views) || 0;
              totalEngagement += Number(ev.engagement) || 0;
            }
          });
        });
        return { totalPosts, totalViews, totalEngagement };
      }, [currentMonthData]);

      const handlePrevMonth = () => setCurrentMonthIndex((prev) => (prev > 0 ? prev - 1 : 11));
      const handleNextMonth = () => setCurrentMonthIndex((prev) => (prev < 11 ? prev + 1 : 0));

      const openModal = (day) => setSelectedDay(day);
      const closeModal = () => setSelectedDay(null);

      const exportToPDF = () => exportMonthToPDF(currentMonthData, MONTHS[currentMonthIndex], dashboardStats.totalPosts);

      return (
        <div className="min-h-screen bg-slate-100 text-slate-800 font-sans p-4 md:p-8">
          {/* HEADER */}
          <div className="max-w-6xl mx-auto mb-6 flex flex-col md:flex-row justify-between items-center bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <div>
              <h1 className="text-3xl font-bold text-slate-900 flex items-center gap-3">
                <IconBarChart className="text-indigo-600 w-8 h-8" />
                Marketing Studio 2026
              </h1>
              <p className="text-slate-500 mt-1 font-medium">Serra Jr. Engenharia</p>
            </div>
            <div className="mt-6 md:mt-0 flex gap-3 flex-wrap justify-end">
              <button onClick={exportToPDF} className="flex items-center gap-2 px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg transition-colors text-sm font-medium shadow-sm">
                <IconDownload className="w-4 h-4" /> Relatório PDF
              </button>
            </div>
          </div>

          {/* DASHBOARD */}
          <div className="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex items-center gap-4">
                <div className="p-3 bg-blue-100 text-blue-600 rounded-lg"><IconCalendar className="w-6 h-6" /></div>
                <div>
                    <p className="text-sm text-slate-500 font-medium uppercase tracking-wider">Posts em {MONTHS[currentMonthIndex]}</p>
                    <p className="text-2xl font-bold text-slate-800">{dashboardStats.totalPosts}</p>
                </div>
            </div>
            <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex items-center gap-4">
                <div className="p-3 bg-emerald-100 text-emerald-600 rounded-lg"><IconEye className="w-6 h-6" /></div>
                <div>
                    <p className="text-sm text-slate-500 font-medium uppercase tracking-wider">Visualizações Mensais</p>
                    <p className="text-2xl font-bold text-slate-800">{dashboardStats.totalViews.toLocaleString('pt-BR')}</p>
                </div>
            </div>
            <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex items-center gap-4">
                <div className="p-3 bg-pink-100 text-pink-600 rounded-lg"><IconHeart className="w-6 h-6" /></div>
                <div>
                    <p className="text-sm text-slate-500 font-medium uppercase tracking-wider">Interações / Engajamento</p>
                    <p className="text-2xl font-bold text-slate-800">{dashboardStats.totalEngagement.toLocaleString('pt-BR')}</p>
                </div>
            </div>
          </div>

          {/* CONTROLES DO CALENDÁRIO */}
          <div className="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between mb-4 bg-slate-800 text-white p-3 rounded-xl shadow-md gap-4 md:gap-0">
            <div className="flex items-center justify-between w-full md:w-auto">
                <button onClick={handlePrevMonth} className="p-2 hover:bg-slate-700 rounded-lg transition-colors">
                <IconChevronLeft className="w-6 h-6" />
                </button>
                <h2 className="text-2xl font-bold text-center uppercase tracking-widest w-64">
                {MONTHS[currentMonthIndex]}
                </h2>
                <button onClick={handleNextMonth} className="p-2 hover:bg-slate-700 rounded-lg transition-colors">
                <IconChevronRight className="w-6 h-6" />
                </button>
            </div>

            <button onClick={() => setHideEmptyDays(!hideEmptyDays)} className="flex items-center gap-2 px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-lg transition-colors text-sm font-medium w-full md:w-auto justify-center">
                {hideEmptyDays ? <IconEye className="w-4 h-4" /> : <IconEyeOff className="w-4 h-4" />}
                {hideEmptyDays ? "Mostrar todos os dias" : "Ocultar dias vazios"}
            </button>
          </div>

          {/* LISTA DE DIAS / TABELA */}
          <div className="max-w-6xl mx-auto bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden mb-12">
            <div className="hidden md:grid grid-cols-12 gap-4 bg-slate-50 border-b border-slate-200 p-4 font-bold text-slate-600 text-sm">
              <div className="col-span-2">Data</div>
              <div className="col-span-10">Cronograma de Conteúdo</div>
            </div>

            <div className="divide-y divide-slate-100">
              {displayedDays.length > 0 ? (
                displayedDays.map((day, idx) => (
                  <div key={idx} onClick={() => day.hasEvents && openModal(day)} className={`grid grid-cols-1 md:grid-cols-12 gap-4 p-5 transition-all group ${day.hasEvents ? 'cursor-pointer hover:bg-indigo-50/40' : 'opacity-50 bg-slate-50/30'}`}>

                    <div className="col-span-12 md:col-span-2 flex flex-row md:flex-col items-center md:items-start gap-2 md:gap-0 border-b md:border-b-0 border-slate-100 pb-2 md:pb-0">
                      <div className="font-black text-2xl text-slate-800 group-hover:text-indigo-600 transition-colors">
                        {day.dateStr}
                      </div>
                      <div className="text-slate-500 uppercase text-xs font-bold tracking-wider">
                        {day.dayOfWeek}
                      </div>
                    </div>

                    <div className="col-span-12 md:col-span-10 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                      {day.hasEvents ? (
                          day.events.map((ev, i) => (
                            <div key={ev.id || i} className={`p-3 rounded-xl border shadow-sm flex flex-col justify-between relative overflow-hidden ${getBadgeStyle(ev.type)}`}>
                              <div>
                                <span className="font-bold text-sm mb-1 block leading-tight">{getEventIcon(ev.type)} {ev.title}</span>
                                {ev.responsible && (
                                    <span className="text-xs mt-2 font-semibold flex items-center gap-1 opacity-80">
                                        <IconUser className="w-3 h-3" /> {ev.responsible}
                                    </span>
                                )}
                              </div>
                              {(ev.views || ev.engagement) && (
                                  <div className="mt-3 pt-2 border-t border-current/20 flex gap-3 text-xs font-semibold opacity-90">
                                      {ev.views && <span title="Visualizações">👁️ {ev.views}</span>}
                                      {ev.engagement && <span title="Interações">❤️ {ev.engagement}</span>}
                                  </div>
                              )}
                            </div>
                          ))
                      ) : (
                          <div className="col-span-1 sm:col-span-2 lg:col-span-3 text-slate-400 text-sm italic py-2">
                             Sem publicações neste dia
                          </div>
                      )}
                    </div>
                  </div>
                ))
              ) : (
                 <div className="p-12 text-center text-slate-500 flex flex-col items-center">
                    <IconCalendar className="w-12 h-12 mb-3 opacity-20" />
                    <p className="font-medium text-lg">Sem publicações agendadas neste mês.</p>
                 </div>
              )}
            </div>
          </div>

          {/* MODAL DE DETALHES DO DIA (SOMENTE LEITURA) */}
          {selectedDay && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 p-4 backdrop-blur-sm" onClick={closeModal}>
              <div className="bg-white rounded-2xl shadow-xl w-full max-w-lg overflow-hidden flex flex-col max-h-[95vh]" onClick={(e) => e.stopPropagation()}>
                <div className="flex justify-between items-center p-5 border-b border-slate-100 bg-slate-50">
                  <div>
                    <h3 className="font-bold text-lg text-slate-800">Pauta do Dia</h3>
                    <p className="text-sm text-slate-500">{selectedDay.dateStr} - {selectedDay.dayOfWeek}</p>
                  </div>
                  <button onClick={closeModal} className="p-2 text-slate-400 hover:bg-slate-200 rounded-full transition-colors"><IconX className="w-5 h-5" /></button>
                </div>

                <div className="p-5 overflow-y-auto flex-1 space-y-3">
                  {selectedDay.events.map(ev => (
                    <div key={ev.id} className={`p-3 rounded-lg border shadow-sm ${getBadgeStyle(ev.type)}`}>
                      <span className="font-bold text-sm block mb-1">{getEventIcon(ev.type)} {ev.title}</span>
                      {ev.responsible && <span className="text-xs opacity-90 block mb-1">Responsável: {ev.responsible}</span>}
                      {ev.details && <span className="text-xs opacity-90 block">{ev.details}</span>}
                      {(ev.views || ev.engagement) && (
                        <div className="mt-2 pt-2 border-t border-current/20 flex gap-3 text-xs font-semibold opacity-90">
                          {ev.views && <span title="Visualizações">👁️ {ev.views}</span>}
                          {ev.engagement && <span title="Interações">❤️ {ev.engagement}</span>}
                        </div>
                      )}
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
